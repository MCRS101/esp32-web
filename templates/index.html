<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32 Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;

            padding: 40px;

            background: #1e1e1e;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        .device {
            color: #aaa;
            margin-bottom: 30px;
        }

        .led {
            width: 120px;
            height: 120px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #333;

            transition: 0.3s;
        }

        .led.on {
            background: yellow;

            box-shadow:
                0 0 20px yellow,
                0 0 40px yellow,
                0 0 80px yellow;
        }

        .status {
            font-size: 22px;

            margin-bottom: 30px;
        }

        .buttons {
            display: flex;

            gap: 15px;
        }

        button {
            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            cursor: pointer;

            color: white;
        }

        .on-button {
            background: #16a34a;
        }

        .off-button {
            background: #dc2626;
        }

        button:hover {
            opacity: 0.8;
        }

        button:active {
            transform: scale(0.97);
        }

    </style>

</head>

<body>

<div class="container">

    <h1>ESP32 CONTROL</h1>

    <div class="device">
        Device: ESP32-TEST-001
    </div>

    <div id="led" class="led"></div>

    <div id="status" class="status">
        GPIO 2 OFF
    </div>

    <div class="buttons">

        <button
            class="on-button"
            onclick="gpioOn()"
        >
            เปิด
        </button>

        <button
            class="off-button"
            onclick="gpioOff()"
        >
            ปิด
        </button>

    </div>

</div>

<script>

const deviceId = "ESP32-1FA932BC";


async function gpioOn() {

    await sendGPIO("on");

}


async function gpioOff() {

    await sendGPIO("off");

}


async function sendGPIO(state) {

    try {

        const response = await fetch(
            `/api/device/${deviceId}/gpio`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    state: state
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            updateLED(state === "on");

        } else {

            alert(data.message);

        }

    } catch (error) {

        alert("ไม่สามารถเชื่อมต่อ Server");

    }

}


function updateLED(isOn) {

    const led =
        document.getElementById("led");

    const status =
        document.getElementById("status");


    if (isOn) {

        led.classList.add("on");

        status.innerText =
            "GPIO 2 ON";

    } else {

        led.classList.remove("on");

        status.innerText =
            "GPIO 2 OFF";

    }

}

</script>

</body>

</html>
